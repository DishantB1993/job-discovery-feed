name: Collect public jobs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python collector.py
      - name: Save changed job feed
        run: |
          git config user.name 'Job Discovery Collector'
          git config user.email 'collector@users.noreply.github.com'
          git add jobs.json
          git diff --cached --quiet || git commit -m 'Refresh public job feed'
          git push
